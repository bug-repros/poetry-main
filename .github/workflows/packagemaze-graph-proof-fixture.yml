name: PackageMaze graph proof fixture

on:
  pull_request:
    paths:
      - ".github/workflows/packagemaze-graph-proof-fixture.yml"
      - "packagemaze-preproduction-graph-proof/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/packagemaze-graph-proof-fixture.yml"
      - "packagemaze-preproduction-graph-proof/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify deterministic bounded graph fixture
        working-directory: packagemaze-preproduction-graph-proof
        run: |
          set -euo pipefail
          node generate-lock.mjs
          git diff --exit-code -- package.json package-lock.json
          test "$(sha256sum package.json | cut -d ' ' -f 1)" = "afa994a987439239c1bcf4fede46f683a525ed8df2131881ab1eda5079ff6be7"
          test "$(sha256sum package-lock.json | cut -d ' ' -f 1)" = "f017f7f0369b32a99ec4366fe39468df9e803c05696423d63010feeecdf8afd3"
          test "$(jq '.packages[""].dependencies | length' package-lock.json)" = 129
          test "$(jq '[.packages | keys[] | select(. != "")] | length' package-lock.json)" = 130
          test "$(jq '.packages["node_modules/packagemaze-graph-proof-direct-000"].dependencies | length' package-lock.json)" = 1
          test "$(wc -c < package-lock.json)" -le 65536
